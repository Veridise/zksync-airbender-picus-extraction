# .github/workflows/pre-commit.yaml for picus-extraction-dev work
name: pre-commit
on:
  pull_request:
    branches: [picus-extraction-dev]
  push:
    branches: [picus-extraction-dev]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - run: nix develop -c pre-commit run --all-files --show-diff-on-failure --color=always
