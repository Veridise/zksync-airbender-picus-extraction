# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Instructions:
# Install pre-commit to the repo (so that it runs with every commit):
#   pre-commit install
# Apply to all files without committing:
#   pre-commit run --all-files
# Update this file:
#   pre-commit autoupdate

# Excluding submodules, some raw test files, and some build-system related files
exclude: 'release_helpers|test/driver/config-file/Inputs/.*\.json|.*/?package-lock\.json|test/sarif/.*sarif.*\.json'
# Default hooks for fixing files
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-case-conflict
  - id: mixed-line-ending
  - id: trailing-whitespace
  - id: end-of-file-fixer

# Run cargo fmt
-   repo: https://github.com/doublify/pre-commit-rust
    rev: master
    hooks:
    -   id: fmt
        args: ['--package', 'llzk_backend']
